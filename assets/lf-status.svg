  <desc>Decorative system monitor showing online status, building, learning and infinite ideas beside a developer with laptop and guitar. The indicators are not measurements.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#061321"/>
      <stop offset=".62" stop-color="#09172A"/>
      <stop offset="1" stop-color="#17132A"/>
